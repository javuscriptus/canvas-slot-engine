<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07020F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex">
  <title>Сочи · Sochi Sunset</title>

  <link rel="preload" as="image" href="client/assets/atlas/symbols.png">
  <link rel="preload" as="image" href="client/assets/atlas/ui.png">
  <link rel="stylesheet" href="client/styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <div id="loader">
      <div class="loader-inner">
        <div class="loader-mark">
          <svg viewBox="0 0 256 220" width="180" height="155" aria-hidden="true">
            <defs>
              <linearGradient id="lgSky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3B1E52"/>
                <stop offset="55%" stop-color="#B84A6A"/>
                <stop offset="100%" stop-color="#FF9A4E"/>
              </linearGradient>
              <linearGradient id="lgSun" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FFF3C4"/>
                <stop offset="50%" stop-color="#FFC24F"/>
                <stop offset="100%" stop-color="#FF7A3C"/>
              </linearGradient>
              <linearGradient id="lgSea" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#1B6E7E"/>
                <stop offset="100%" stop-color="#0C3546"/>
              </linearGradient>
              <clipPath id="clipDisc"><circle cx="128" cy="110" r="92"/></clipPath>
            </defs>

            <g clip-path="url(#clipDisc)">
              <rect x="36" y="18" width="184" height="184" fill="url(#lgSky)"/>
              <circle cx="128" cy="126" r="44" fill="url(#lgSun)"/>
              <path d="M 36 140 L 74 92 L 104 130 L 132 86 L 168 140 Z" fill="#4B2A63"/>
              <path d="M 120 140 L 158 98 L 188 132 L 212 108 L 220 140 Z" fill="#5C3574"/>
              <rect x="36" y="138" width="184" height="64" fill="url(#lgSea)"/>
              <path d="M 116 138 L 140 138 L 156 202 L 100 202 Z" fill="#FFC24F" opacity="0.28"/>
              <g stroke="#8FE3F0" stroke-width="3" stroke-linecap="round" opacity="0.5">
                <path d="M 58 154 h 22 M 96 168 h 30 M 150 160 h 26 M 74 184 h 34 M 160 186 h 24"/>
              </g>
            </g>

            <circle cx="128" cy="110" r="92" fill="none" stroke="#F7C948" stroke-width="7"/>
            <circle cx="128" cy="110" r="92" fill="none" stroke="#A9690C" stroke-width="2"/>
          </svg>
        </div>
        <h1 class="loader-title">СОЧИ <span>SOCHI SUNSET</span></h1>
        <div class="progress-track"><div id="progress-fill"></div></div>
        <div id="loader-status">Загрузка…</div>
      </div>
    </div>

    <div id="error-screen" class="hidden">
      <div class="error-inner">
        <div class="error-mark">!</div>
        <p id="error-text"></p>
        <button id="error-retry" type="button">Повторить</button>
      </div>
    </div>

    <div id="rotate-hint">
      <div class="rotate-icon"></div>
      <p>Поверните устройство</p>
    </div>
  </div>

  <script type="module" src="client/src/main.js"></script>
  <noscript>
    <p class="noscript-note">
      Для игры нужен включённый JavaScript.
    </p>
  </noscript>
</body>
</html>
